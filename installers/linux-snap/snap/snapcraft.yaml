name: markdownviewer
version: '1.4.0'
summary: View Markdown files rendered in your browser
description: |
  MarkView renders Markdown files in your browser with a clean reading
  experience.

  Open .md or .markdown files and instantly see them rendered with proper
  formatting, syntax-highlighted code blocks, and your choice of light or dark
  themes. It is built for reading README files, documentation, notes, and
  technical specs without opening a full editor.

  Highlights:
  - Renders Markdown to HTML using PowerShell's built-in converter
  - Opens in your default browser with no separate app window to manage
  - Highlights code blocks with bundled highlight.js support for 190+ languages
  - Typesets inline and display math offline with bundled KaTeX
  - Includes 10 theme variations across light and dark modes
  - Opens links to other local Markdown files in the viewer
  - Works offline with no data collection
  - Blocks remote images by default until you opt in per document
title: MarkView
license: MIT
website: https://github.com/omasoud/MarkdownViewer
issues: https://github.com/omasoud/MarkdownViewer/issues
contact: https://github.com/omasoud/MarkdownViewer/issues
source-code: https://github.com/omasoud/MarkdownViewer
icon: staged/meta/gui/markview.png

base: core24
confinement: strict
grade: stable
platforms:
  amd64:
  arm64:

apps:
  markdownviewer:
    command: bin/markview
    desktop: meta/gui/markview.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - browser-support

parts:
  markdownviewer:
    plugin: dump
    source: staged/
    stage-packages:
      - zenity

layout:
  /usr/share/zenity:
    bind: $SNAP/usr/share/zenity
